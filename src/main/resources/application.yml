spring:
  application:
    name: spring-ai-ollama-rag
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: when_missing   # auto-pull models if not present locally
      chat:
        options:
          model: llama3.2
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text

server:
  port: 8080
